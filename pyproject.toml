[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symiv"
version = "0.1.0"
description = "Symbolic regression under endogeneity: formula search scored by instrumental-variable moment conditions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
search = ["pysr>=1.0"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
symiv = ["julia/*.jl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["julia: needs PySR and a working Julia install (slow; run with `pytest -m julia`)"]
# Julia raises access violations on purpose (GC safepoints); pytest's faulthandler would print them as crashes.
addopts = "-m \"not julia\" -p no:faulthandler"
